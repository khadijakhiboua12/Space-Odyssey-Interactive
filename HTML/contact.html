<section class="contenu">
  <div class="container">
    <h1>Formulaire de Contact</h1>

    <form id="contactForm" novalidate>

      <div class="form-group">
        <label for="name">Nom complet *</label>
        <input type="text" id="name" name="name" placeholder="Votre nom">
        <small class="error-message"></small>
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input type="text" id="email" name="email" placeholder="exemple@email.com">
        <small class="error-message"></small>
      </div>

      <div class="form-group">
        <label for="phone">Téléphone *</label>
        <input type="text" id="phone" name="phone" placeholder="+212">
        <small class="error-message"></small>
      </div>

      <div class="form-group">
        <label for="date">Date de naissance *</label>
        <input type="text" id="date" name="date" placeholder="JJ/MM/AAAA">
        <small class="error-message"></small>
      </div>

      <div class="form-group">
        <label for="message">Message *</label>
        <textarea id="message" name="message" rows="5" placeholder="Votre message ici..."></textarea>
        <small class="error-message"></small>
      </div>

      <button type="submit" class="submit">Envoyer</button>
    </form>
  </div>
