 <!-- -----------------------------------------------------------------------------les cartes --- --------------------------------------------------------------------------->
<section>
  <div class="mission-controls">
    <input type="text" class="search"id="searchInput" placeholder="Rechercher une mission..." />
    <select class="filter-agency" id="agencyFilter">
      <option value="">Toutes les agences</option>
      <option value="NASA">NASA</option>
      <option value="ESA">ESA</option>
      <option value="NASA/ESA/CSA">NASA/ESA/CSA</option>
      <option value="ESA/JAXA">ESA/JAXA</option>
      <!-- Ajouter d'autres agences ici -->
    </select>

    <select class="filter-year" id="yearInput">
      <option value="">Toutes les années</option>
      <option value="1969">1969</option>
      <option value="1971">1971</option>
      <option value="1977">1977</option>
      <option value="2004">2004</option>
      <option value="2011">2011</option>
      <option value="2022">2022</option>
      <option value="2021">2021</option>
      <option value="2018">2018</option>
      
      <!-- Ajouter d'autres années -->
    </select>
    <Select class="subjectInput" id="subjectInput">
          <option value="">Toutes les objectives</option>
          <option value="Premier alunissage habité">Premier alunissage habité</option>
          <option value="Exploration du système solaire externe">Exploration du système solaire externe</option>
          <option value=" Étude de la comète 67P/Churyumov-Gerasimenko"> Étude de la comète 67P/Churyumov-Gerasimenko</option>
          <option value="Exploration du cratère Gale sur Mars">Exploration du cratère Gale sur Mars</option>
          <option value="Test du système de lancement SLS et d’Orion">Test du système de lancement SLS et d’Orion</option>
          <option value=" Observation de l’univers primitif"> Observation de l’univers primitif</option>
          <option value=" Exploration de la planète Mercure"> Exploration de la planète Mercure</option>
    </select>

<!-- Conteneur où s'afficheront les noms des favoris -->
 
 <button class="btn-add"><i class="fa-solid fa-plus"></i> Ajouter Mession</button>
  </div>

   <!-- 💫 Formulaire d'ajout -->
    <form id="addMissionForm" style="display: none; margin-top: 20px;">
      <label>Nom:</label>
      <input type="text" id="missionName" required />

      <label>Agence:</label>
      <input type="text" id="missionAgency" required />

      <label>Objectif:</label>
      <input type="text" id="missionObjective" required />

      <label>Date de lancement:</label>
      <input type="date" id="missionDate" required />

      <label>Image (URL):</label>
      <input type="text" id="missionImage" placeholder="Images/i4.png" />

      <button type="submit">Ajouter</button>
      <button type="button" id="btnCancel">Annuler</button>
    </form> 

    <section>
        <div id="mission-cards">
            <div id="favoris-cards"></div>
        </div>
    </section>

    <!-- <div id="mission-cards"></div> -->

<!-- Formulaire de modification (hidden par défaut) -->
<form id="editMissionForm" style="display:none; margin-top:20px;">
  <input type="hidden" id="editMissionId" />
  <label>Nom:</label>
  <input type="text" id="editMissionName" required />

  <label>Agence:</label>
  <input type="text" id="editMissionAgency" required />

  <label>Objectif:</label>
  <input type="text" id="editMissionObjective" required />

  <label>Date de lancement:</label>
  <input type="date" id="editMissionDate" required />

  <label>Image (URL):</label>
  <input type="text" id="editMissionImage" placeholder="..Images/default.png" />

  <button type="submit">Enregistre</button>
  <button type="button" id="btnCancelEdit">Annuler</button>
</form>
